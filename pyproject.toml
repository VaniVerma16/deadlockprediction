[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-dataset"
version = "0.1.0"
description = "QEMU/eBPF deadlock dataset generation pipeline"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
deadlock-dataset = "deadlock_dataset.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

